[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[project]
name = "xmldataset"
version = "2.0.0"
description = "Extract Python datasets from XML using a simple, indented profile"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "James Spurin", email = "james@spurin.com" }]
keywords = ["xml", "parsing", "dataset", "extraction", "etl"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.2"]

[project.scripts]
xmldataset = "xmldataset._cli:main"

[project.urls]
Homepage = "https://github.com/spurin/xmldataset"
Documentation = "https://xmldataset.readthedocs.io"
Changelog = "https://github.com/spurin/xmldataset/blob/master/CHANGELOG.md"
Issues = "https://github.com/spurin/xmldataset/issues"

[dependency-groups]
dev = [{ include-group = "test" }, { include-group = "lint" }]
test = [
    "pytest>=9.2",
    "hypothesis>=6.170",
    "coverage>=7.17",
    "pyyaml>=6.0.2",
    "jsonschema>=4.25",
]
lint = ["ruff>=0.17.3", "mypy>=2.4", "types-pyyaml>=6.0.12", "types-jsonschema>=4.25"]
docs = [
    "sphinx>=9.2",
    "myst-parser>=4",
    "furo>=2025.12.19",
    "sphinx-design>=0.7",
    "pyyaml>=6.0.2",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.dependency-groups]
# Sphinx 9.2 requires Python 3.13+; the library itself supports 3.11+.
docs = { requires-python = ">=3.13" }

[tool.uv.build-backend]
source-include = ["tests/**", "examples/**", "CHANGELOG.md"]

[tool.ruff]
line-length = 88
# The frozen 1.0.4 engine is a test oracle and stays byte-for-byte as released.
extend-exclude = ["tests/legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
# XML and profile literals in tests read better unwrapped.
"tests/**" = ["E501"]


[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["^tests/legacy/"]

[[tool.mypy.overrides]]
module = ["tests.legacy.*"]
follow_imports = "skip"

[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["xmldataset"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
